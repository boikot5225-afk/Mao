<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказы — украшения</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fbf8f6;
    --card: #ffffff;
    --text: #2c2422;
    --text2: #7a6f6b;
    --text3: #a89e9a;
    --border: rgba(44,36,34,0.1);
    --accent: #b8865f;
    --accent-dark: #93694a;
    --green: #2e8b57;
    --green-bg: #e7f4ec;
    --amber: #b8860b;
    --amber-bg: #fdf3d9;
    --red: #c0392b;
    --red-bg: #fbe7e4;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }

  #app { max-width: 720px; margin: 0 auto; padding: 20px 16px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .header-left h1 { font-size: 22px; font-weight: 700; }
  #stats { font-size: 13px; color: var(--text2); }
  #logout-btn {
    font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--card); color: var(--text2);
  }

  #toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  #search {
    width: 100%; padding: 10px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--card); color: var(--text);
  }
  #filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 13px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text2);
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #orders-list { display: flex; flex-direction: column; gap: 12px; }

  .order-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    border-left: 4px solid var(--border);
  }
  .order-card.urgent { border-left-color: var(--amber); background: linear-gradient(var(--amber-bg), var(--amber-bg)) padding-box, var(--card); }
  .order-card.overdue { border-left-color: var(--red); background: linear-gradient(var(--red-bg), var(--red-bg)) padding-box, var(--card); }

  .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .order-name { font-size: 16px; font-weight: 700; }
  .order-chat { font-size: 12px; color: var(--accent); text-decoration: none; }
  .order-chat:hover { text-decoration: underline; }
  .order-price { font-size: 15px; font-weight: 600; white-space: nowrap; }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; cursor: default; }
  .badge.paid { background: var(--green-bg); color: var(--green); }
  .badge.unpaid { background: var(--red-bg); color: var(--red); cursor: pointer; }
  .badge.deadline-ok { background: #eee; color: var(--text2); }
  .badge.deadline-urgent { background: var(--amber-bg); color: var(--amber); }
  .badge.deadline-overdue { background: var(--red-bg); color: var(--red); }
  .badge.new-request { background: #e9e5fb; color: #5b3fd1; }
  .badge.status-in_progress { background: #eef1f6; color: #55606e; cursor: pointer; }
  .badge.status-ready { background: var(--amber-bg); color: var(--amber); cursor: pointer; }
  .badge.status-done { background: var(--green-bg); color: var(--green); cursor: pointer; }

  .order-desc { font-size: 13px; color: var(--text2); white-space: pre-wrap; }

  .photo-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .photo-row img {
    width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer;
  }

  .order-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .icon-btn {
    font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--card); color: var(--text2);
  }
  .icon-btn.danger { color: var(--red); }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }

  #empty-state { text-align: center; padding: 60px 16px; color: var(--text3); white-space: pre-wrap; }

  #add-btn {
    position: fixed; bottom: 22px; right: 50%; transform: translateX(50%);
    max-width: 720px; width: calc(100% - 32px);
    background: var(--accent); color: #fff; border: none;
    font-size: 15px; font-weight: 600; padding: 14px; border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  #add-btn:hover { background: var(--accent-dark); }
  #add-btn:disabled { opacity: 0.6; }

  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: flex-end; justify-content: center; z-index: 200; padding: 0;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 20px 18px 24px;
  }
  #modal h2 { font-size: 18px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text2); }
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea {
    padding: 10px 12px; font-size: 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--card); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .checkbox-field { flex-direction: row; align-items: center; gap: 8px; }
  .checkbox-field input { width: 18px; height: 18px; }

  #photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .preview-thumb { position: relative; width: 64px; height: 64px; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .preview-thumb .remove-x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--red); color: #fff; border: none; font-size: 12px; line-height: 1;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button {
    flex: 1; padding: 12px; font-size: 14px; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  #save-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  #cancel-btn { background: var(--card); color: var(--text2); }

  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    align-items: center; justify-content: center; z-index: 300; padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--red); color: #fff; font-size: 13px; padding: 10px 18px;
    border-radius: var(--radius-sm); z-index: 400; display: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <h1>Заказы</h1>
      <div id="stats"></div>
    </div>
    <button id="logout-btn">Выйти</button>
  </header>

  <div id="toolbar">
    <input id="search" type="text" placeholder="Поиск по имени заказчика...">
    <div id="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="new_requests">Новые заявки</button>
      <button class="filter-btn" data-filter="unpaid">Не оплачено</button>
      <button class="filter-btn" data-filter="urgent">Горящие</button>
      <button class="filter-btn" data-filter="ready">Готово к выдаче</button>
    </div>
  </div>

  <div id="orders-list"></div>
  <div id="empty-state" style="display:none"></div>
</div>

<button id="add-btn">+ Новый заказ</button>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Новый заказ</h2>
    <form id="order-form">
      <div class="field">
        <label>Имя заказчика *</label>
        <input type="text" id="f-name" required>
      </div>
      <div class="field">
        <label>Ссылка на чат</label>
        <input type="text" id="f-chat" placeholder="https://t.me/... или @username">
      </div>
      <div class="field">
        <label>Состав заказа</label>
        <textarea id="f-desc" placeholder="Например: серьги-гвоздики, серебро, жемчуг"></textarea>
      </div>
      <div class="field">
        <label>Фото</label>
        <input type="file" id="f-photos" accept="image/*" multiple>
        <div id="photo-preview"></div>
      </div>
      <div class="field">
        <label>Стоимость, ₽</label>
        <input type="number" id="f-price" min="0" step="1">
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="f-paid">
        <label for="f-paid" style="font-weight:400">Оплачено</label>
      </div>
      <div class="field">
        <label>Срок сдачи</label>
        <input type="date" id="f-deadline">
      </div>
      <div class="modal-actions">
        <button type="button" id="cancel-btn">Отмена</button>
        <button type="submit" id="save-btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div id="lightbox"><img id="lightbox-img" src=""></div>
<div id="toast"></div>

<script>
(function(){
  var orders = [];
  var editingId = null;
  var currentPhotos = []; // data URLs (new) or /api/photo/... URLs (existing)
  var filter = 'all';
  var search = '';

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function(){ el.style.display = 'none'; }, 3000);
  }

  async function api(url, options) {
    var res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
    if (res.status === 401) {
      location.href = '/login.html';
      throw new Error('unauthorized');
    }
    if (!res.ok) throw new Error('request failed: ' + res.status);
    return res.status === 204 ? null : res.json();
  }

  async function loadOrders() {
    orders = await api('/api/orders');
  }

  function daysLeft(deadline) {
    if (!deadline) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(deadline + 'T00:00:00');
    return Math.round((d - today) / 86400000);
  }

  function deadlineBadge(deadline, status) {
    var dl = daysLeft(deadline);
    if (dl === null) return null;
    if (status !== 'in_progress') {
      return { text: 'До ' + formatDate(deadline), cls: 'deadline-ok', dl: dl };
    }
    var text, cls;
    if (dl < 0) { text = 'Просрочено на ' + Math.abs(dl) + ' дн.'; cls = 'deadline-overdue'; }
    else if (dl === 0) { text = 'Срок сегодня'; cls = 'deadline-urgent'; }
    else if (dl <= 2) { text = 'Осталось ' + dl + ' дн.'; cls = 'deadline-urgent'; }
    else { text = 'До ' + formatDate(deadline); cls = 'deadline-ok'; }
    return { text: text, cls: cls, dl: dl };
  }

  function formatDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function isUrgentOrOverdue(order) {
    if (order.status !== 'in_progress') return false;
    var dl = daysLeft(order.deadline);
    return dl !== null && dl <= 2;
  }

  var STATUS_CYCLE = ['in_progress', 'ready', 'done'];
  var STATUS_LABELS = { in_progress: 'В работе', ready: 'Готово', done: 'Отдано' };

  function resizeImage(file, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxDim = 900;
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderPhotoPreview() {
    var el = document.getElementById('photo-preview');
    el.innerHTML = '';
    currentPhotos.forEach(function(src, idx) {
      var div = document.createElement('div');
      div.className = 'preview-thumb';
      div.innerHTML = '<img src="' + src + '"><button type="button" class="remove-x" data-idx="' + idx + '">×</button>';
      el.appendChild(div);
    });
  }

  document.getElementById('photo-preview').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-x')) {
      var idx = parseInt(e.target.getAttribute('data-idx'), 10);
      currentPhotos.splice(idx, 1);
      renderPhotoPreview();
    }
  });

  document.getElementById('f-photos').addEventListener('change', function(e) {
    var files = Array.prototype.slice.call(e.target.files);
    if (!files.length) return;
    files.forEach(function(file) {
      resizeImage(file, function(dataUrl) {
        currentPhotos.push(dataUrl);
        renderPhotoPreview();
      });
    });
    e.target.value = '';
  });

  function openModal(order) {
    editingId = order ? order.id : null;
    document.getElementById('modal-title').textContent = order ? 'Редактировать заказ' : 'Новый заказ';
    document.getElementById('f-name').value = order ? order.name : '';
    document.getElementById('f-chat').value = order ? order.chat : '';
    document.getElementById('f-desc').value = order ? order.desc : '';
    document.getElementById('f-price').value = order ? order.price : '';
    document.getElementById('f-paid').checked = order ? order.paid : false;
    document.getElementById('f-deadline').value = order ? order.deadline || '' : '';
    currentPhotos = order ? (order.photos || []).slice() : [];
    renderPhotoPreview();
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('f-name').focus();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('order-form').reset();
    currentPhotos = [];
    editingId = null;
  }

  document.getElementById('add-btn').addEventListener('click', function(){ openModal(null); });
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.getElementById('logout-btn').addEventListener('click', async function() {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login.html';
  });

  document.getElementById('order-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохранение...';
    var data = {
      name: document.getElementById('f-name').value.trim(),
      chat: document.getElementById('f-chat').value.trim(),
      desc: document.getElementById('f-desc').value.trim(),
      price: parseFloat(document.getElementById('f-price').value) || 0,
      paid: document.getElementById('f-paid').checked,
      deadline: document.getElementById('f-deadline').value,
      photos: currentPhotos.slice()
    };
    try {
      if (editingId) {
        var updated = await api('/api/orders/' + editingId, { method: 'PUT', body: JSON.stringify(data) });
        var idx = orders.findIndex(function(o){ return o.id === editingId; });
        if (idx !== -1) orders[idx] = updated;
      } else {
        var created = await api('/api/orders', { method: 'POST', body: JSON.stringify(data) });
        orders.push(created);
      }
      closeModal();
      render();
    } catch (err) {
      showToast('Не удалось сохранить заказ');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';
    }
  });

  document.getElementById('search').addEventListener('input', function(e) {
    search = e.target.value.toLowerCase();
    render();
  });

  document.getElementById('filters').addEventListener('click', function(e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filter = btn.getAttribute('data-filter');
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });

  document.getElementById('lightbox').addEventListener('click', function() {
    this.classList.remove('open');
  });

  function render() {
    var list = document.getElementById('orders-list');
    var empty = document.getElementById('empty-state');
    list.innerHTML = '';

    var visible = orders.filter(function(o) {
      if (search && o.name.toLowerCase().indexOf(search) === -1) return false;
      if (filter === 'unpaid' && o.paid) return false;
      if (filter === 'urgent' && !isUrgentOrOverdue(o)) return false;
      if (filter === 'new_requests' && o.reviewed) return false;
      if (filter === 'ready' && o.status !== 'ready') return false;
      return true;
    });

    visible.sort(function(a, b) {
      var doneA = a.status === 'done' ? 1 : 0, doneB = b.status === 'done' ? 1 : 0;
      if (doneA !== doneB) return doneA - doneB;
      var da = daysLeft(a.deadline), db = daysLeft(b.deadline);
      if (da === null && db === null) return b.createdAt - a.createdAt;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });

    if (!visible.length) {
      empty.style.display = 'block';
      empty.textContent = orders.length ? 'Ничего не найдено.' : 'Заказов пока нет.\nНажмите «+ Новый заказ», чтобы добавить первый.';
    } else {
      empty.style.display = 'none';
    }

    visible.forEach(function(o) {
      var badge = deadlineBadge(o.deadline, o.status);
      var cardCls = 'order-card';
      if (badge) {
        if (badge.cls === 'deadline-overdue') cardCls += ' overdue';
        else if (badge.cls === 'deadline-urgent') cardCls += ' urgent';
      }

      var card = document.createElement('div');
      card.className = cardCls;

      var chatHtml = '';
      if (o.chat) {
        var href = /^https?:\/\//i.test(o.chat) ? o.chat : null;
        chatHtml = href
          ? '<a class="order-chat" href="' + escapeAttr(href) + '" target="_blank" rel="noopener">Чат ↗</a>'
          : '<span class="order-chat">' + escapeHtml(o.chat) + '</span>';
      }

      var badgesHtml = '';
      if (!o.reviewed) badgesHtml += '<span class="badge new-request">Новая заявка</span>';
      badgesHtml += '<span class="badge status-' + o.status + '" data-cycle-status="' + o.id + '">' + STATUS_LABELS[o.status] + '</span>';
      badgesHtml += '<span class="badge ' + (o.paid ? 'paid' : 'unpaid') + '" data-toggle-paid="' + o.id + '">' + (o.paid ? 'Оплачено' : 'Не оплачено') + '</span>';
      if (badge) badgesHtml += '<span class="badge ' + badge.cls + '">' + badge.text + '</span>';

      var photosHtml = '';
      if (o.photos && o.photos.length) {
        photosHtml = '<div class="photo-row">' + o.photos.map(function(src) {
          return '<img src="' + src + '" data-full="' + src + '">';
        }).join('') + '</div>';
      }

      card.innerHTML =
        '<div class="order-top">' +
          '<div><div class="order-name">' + escapeHtml(o.name) + '</div>' + chatHtml + '</div>' +
          '<div class="order-price">' + (o.price ? o.price.toLocaleString('ru-RU') + ' ₽' : '') + '</div>' +
        '</div>' +
        '<div class="badge-row">' + badgesHtml + '</div>' +
        (o.desc ? '<div class="order-desc">' + escapeHtml(o.desc) + '</div>' : '') +
        photosHtml +
        '<div class="order-actions">' +
          '<button class="icon-btn" data-edit="' + o.id + '">Изменить</button>' +
          '<button class="icon-btn danger" data-delete="' + o.id + '">Удалить</button>' +
        '</div>';

      list.appendChild(card);
    });

    var unpaidCount = orders.filter(function(o){ return !o.paid; }).length;
    var urgentCount = orders.filter(isUrgentOrOverdue).length;
    var newCount = orders.filter(function(o){ return !o.reviewed; }).length;
    var readyCount = orders.filter(function(o){ return o.status === 'ready'; }).length;
    document.getElementById('stats').textContent =
      'Всего: ' + orders.length + ' · Новых заявок: ' + newCount + ' · Не оплачено: ' + unpaidCount +
      ' · Горит: ' + urgentCount + ' · Готово к выдаче: ' + readyCount;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  document.getElementById('orders-list').addEventListener('click', async function(e) {
    var img = e.target.closest('img[data-full]');
    if (img) {
      document.getElementById('lightbox-img').src = img.getAttribute('data-full');
      document.getElementById('lightbox').classList.add('open');
      return;
    }
    var editBtn = e.target.closest('[data-edit]');
    if (editBtn) {
      var order = orders.find(function(o){ return o.id === editBtn.getAttribute('data-edit'); });
      if (order) openModal(order);
      return;
    }
    var delBtn = e.target.closest('[data-delete]');
    if (delBtn) {
      var id = delBtn.getAttribute('data-delete');
      var order = orders.find(function(o){ return o.id === id; });
      if (order && confirm('Удалить заказ «' + order.name + '»?')) {
        try {
          await api('/api/orders/' + id, { method: 'DELETE' });
          orders = orders.filter(function(o){ return o.id !== id; });
          render();
        } catch (err) {
          showToast('Не удалось удалить заказ');
        }
      }
      return;
    }
    var toggle = e.target.closest('[data-toggle-paid]');
    if (toggle) {
      var id2 = toggle.getAttribute('data-toggle-paid');
      var order2 = orders.find(function(o){ return o.id === id2; });
      if (order2) {
        try {
          var updated2 = await api('/api/orders/' + id2, {
            method: 'PUT',
            body: JSON.stringify(Object.assign({}, order2, { paid: !order2.paid }))
          });
          var idx2 = orders.findIndex(function(o){ return o.id === id2; });
          orders[idx2] = updated2;
          render();
        } catch (err) {
          showToast('Не удалось изменить статус оплаты');
        }
      }
      return;
    }
    var cycle = e.target.closest('[data-cycle-status]');
    if (cycle) {
      var id3 = cycle.getAttribute('data-cycle-status');
      var order3 = orders.find(function(o){ return o.id === id3; });
      if (order3) {
        var nextStatus = STATUS_CYCLE[(STATUS_CYCLE.indexOf(order3.status) + 1) % STATUS_CYCLE.length];
        try {
          var updated3 = await api('/api/orders/' + id3, {
            method: 'PUT',
            body: JSON.stringify(Object.assign({}, order3, { status: nextStatus }))
          });
          var idx3 = orders.findIndex(function(o){ return o.id === id3; });
          orders[idx3] = updated3;
          render();
        } catch (err) {
          showToast('Не удалось изменить статус выполнения');
        }
      }
    }
  });

  (async function init() {
    try {
      await loadOrders();
      render();
    } catch (err) {
      if (err.message !== 'unauthorized') showToast('Не удалось загрузить заказы');
    }
  })();
})();
</script>
</body>
</html>
