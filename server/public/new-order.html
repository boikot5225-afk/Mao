<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оставить заявку на украшение</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fbf8f6; --card: #ffffff; --text: #2c2422; --text2: #7a6f6b;
    --border: rgba(44,36,34,0.1); --accent: #b8865f; --accent-dark: #93694a;
    --radius: 12px; --radius-sm: 8px; --green: #2e8b57; --green-bg: #e7f4ec;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 16px;
  }
  #wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  #subtitle { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text2); }
  .field input[type=text], .field textarea {
    padding: 10px 12px; font-size: 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--card); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 90px; }
  #photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .preview-thumb { position: relative; width: 64px; height: 64px; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .preview-thumb .remove-x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    background: #c0392b; color: #fff; border: none; font-size: 12px; line-height: 1;
  }
  .honeypot { position: absolute; left: -9999px; top: -9999px; }
  #submit-btn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); margin-top: 8px;
  }
  #submit-btn:hover { background: var(--accent-dark); }
  #submit-btn:disabled { opacity: 0.6; }
  #success {
    display: none; text-align: center; padding: 40px 20px; background: var(--green-bg);
    border-radius: var(--radius); color: var(--green); font-size: 15px;
  }
  #error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Оставить заявку</h1>
  <div id="subtitle">Расскажите, какое украшение хотите заказать — я свяжусь с вами и обсудим детали, цену и сроки.</div>

  <form id="order-form">
    <div class="field">
      <label>Ваше имя *</label>
      <input type="text" id="f-name" required>
    </div>
    <div class="field">
      <label>Как с вами связаться (телеграм, инстаграм и т.п.)</label>
      <input type="text" id="f-chat" placeholder="https://t.me/... или @username">
    </div>
    <div class="field">
      <label>Что хотите заказать</label>
      <textarea id="f-desc" placeholder="Например: серьги-гвоздики, серебро, жемчуг"></textarea>
    </div>
    <div class="field">
      <label>Фото-референс (необязательно)</label>
      <input type="file" id="f-photos" accept="image/*" multiple>
      <div id="photo-preview"></div>
    </div>
    <div class="field honeypot" aria-hidden="true">
      <label for="f-company">Компания</label>
      <input type="text" id="f-company" name="company" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" id="submit-btn">Отправить заявку</button>
    <div id="error"></div>
  </form>

  <div id="success">Спасибо! Заявка отправлена, я скоро с вами свяжусь.</div>
</div>

<script>
(function(){
  var currentPhotos = [];

  function resizeImage(file, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxDim = 900;
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderPhotoPreview() {
    var el = document.getElementById('photo-preview');
    el.innerHTML = '';
    currentPhotos.forEach(function(src, idx) {
      var div = document.createElement('div');
      div.className = 'preview-thumb';
      div.innerHTML = '<img src="' + src + '"><button type="button" class="remove-x" data-idx="' + idx + '">×</button>';
      el.appendChild(div);
    });
  }

  document.getElementById('photo-preview').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-x')) {
      var idx = parseInt(e.target.getAttribute('data-idx'), 10);
      currentPhotos.splice(idx, 1);
      renderPhotoPreview();
    }
  });

  document.getElementById('f-photos').addEventListener('change', function(e) {
    var files = Array.prototype.slice.call(e.target.files);
    if (!files.length) return;
    files.forEach(function(file) {
      resizeImage(file, function(dataUrl) {
        currentPhotos.push(dataUrl);
        renderPhotoPreview();
      });
    });
    e.target.value = '';
  });

  document.getElementById('order-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Отправка...';
    try {
      var res = await fetch('/api/public-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('f-name').value.trim(),
          chat: document.getElementById('f-chat').value.trim(),
          desc: document.getElementById('f-desc').value.trim(),
          photos: currentPhotos,
          company: document.getElementById('f-company').value
        })
      });
      if (!res.ok) throw new Error('request failed');
      document.getElementById('order-form').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Не получилось отправить заявку. Попробуйте ещё раз чуть позже.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Отправить заявку';
    }
  });
})();
</script>
</body>
</html>
