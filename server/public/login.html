<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Заказы</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fbf8f6; color: #2c2422;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  form {
    background: #fff; border: 1px solid rgba(44,36,34,0.1); border-radius: 12px;
    padding: 32px 28px; width: 100%; max-width: 320px;
  }
  h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid rgba(44,36,34,0.2); border-radius: 8px; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 11px; font-size: 14px; font-weight: 600;
    background: #b8865f; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #93694a; }
  #error { color: #c0392b; font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
</style>
</head>
<body>
<form id="login-form">
  <h1>Заказы</h1>
  <input type="password" id="password" placeholder="Пароль" autofocus required>
  <button type="submit">Войти</button>
  <div id="error"></div>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var password = document.getElementById('password').value;
  var errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    });
    if (res.ok) {
      location.href = '/';
    } else {
      errorEl.textContent = 'Неверный пароль';
    }
  } catch (err) {
    errorEl.textContent = 'Ошибка соединения';
  }
});
</script>
</body>
</html>
