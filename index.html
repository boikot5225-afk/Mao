// ─────────────────────────────────────────────
// ENGINE
// ─────────────────────────────────────────────

let currentScene = 'start';
let history = [];
let visited = new Set();
let speaking = false;
let utterance = null;
let langMode = 'zh';

const totalScenes = Object.keys(SCENES).filter(k => !SCENES[k].isEnding).length;

function getProgress() {
  return Math.min(100, Math.round((visited.size / (totalScenes * 0.7)) * 100));
}

function plainText(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  stopSpeaking();
  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.88;
  utterance.pitch = 0.95;
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.startsWith('zh'));
  if (zh) utterance.voice = zh;
  utterance.onend = () => { speaking = false; updateSpeakBtn(); };
  speechSynthesis.speak(utterance);
  speaking = true;
  updateSpeakBtn();
}

function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false;
  updateSpeakBtn();
}

function updateSpeakBtn() {
  const btn = document.querySelector('.speak-btn');
  if (!btn) return;
  if (speaking) { btn.classList.add('speaking'); btn.innerHTML = '⏹ 停止朗读'; }
  else { btn.classList.remove('speaking'); btn.innerHTML = '🔊 朗读'; }
}

function setLang(mode) {
  langMode = mode;
  Audio.paper();
  // Full re-render so choice buttons also update
  render();
  // Now apply lang-specific UI on top
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const data = STATIC[currentScene] || {};
  const sceneTextEl = document.querySelector('.scene-text');
  const tlPanel = document.querySelector('.translation-panel');

  if (mode === 'pinyin') {
    if (sceneTextEl) {
      if (!sceneTextEl.dataset.original) sceneTextEl.dataset.original = sceneTextEl.innerHTML;
      sceneTextEl.innerHTML = data.pinyin || sceneTextEl.dataset.original;
      sceneTextEl.classList.add('pinyin-on');
    }
  } else if (mode === 'ru') {
    if (tlPanel) {
      tlPanel.classList.add('visible');
      tlPanel.innerHTML = data.ru || '<p>Перевод недоступен.</p>';
    }
  }
}

function goTo(sceneId) {
  stopSpeaking();
  if (currentScene !== 'start') history.push(currentScene);
  visited.add(sceneId);
  currentScene = sceneId;
  langMode = 'zh';
  render();
  Audio.onSceneEnter(sceneId);
  if (SCENES[sceneId] && SCENES[sceneId].quote) setTimeout(() => Audio.chime(), 1200);
  autoSave();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (history.length === 0) return;
  stopSpeaking();
  currentScene = history.pop();
  langMode = 'zh';
  render();
  Audio.onSceneEnter(currentScene);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  stopSpeaking();
  currentScene = 'start';
  history = [];
  visited.clear();
  langMode = 'zh';
  deleteSave();
  render();
  Audio.onSceneEnter('start');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const scene = SCENES[currentScene];
  const el = document.getElementById('content');

  const sceneTextHTML = `
    <div class="scene-text scene-fade">${scene.text}${scene.quote ? `<div class="atmo-quote">「${scene.quote}」</div>` : ''}</div>
    <div class="translation-panel"></div>
  `;

  const langToolbar = `
    <div class="lang-toolbar">
      <span class="lang-label">显示：</span>
      <button class="lang-btn active" data-mode="zh" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" data-mode="pinyin" onclick="setLang('pinyin')">拼音</button>
      <button class="lang-btn" data-mode="ru" onclick="setLang('ru')">Перевод</button>
    </div>
  `;

  let breadcrumbHTML = '';
  if (history.length > 0) {
    const crumbs = history.slice(-3).map(id => { const s = SCENES[id]; return `<span>${s ? s.chapter : id}</span>`; });
    breadcrumbHTML = `<div class="breadcrumb">${crumbs.join(' › ')} › <span>${scene.chapter}</span></div>`;
  }

  const saveDate = getSaveDate();
  const continueBanner = (currentScene === 'start' && saveDate) ? `
    <div style="background:rgba(196,146,58,0.07);border:1px solid rgba(196,146,58,0.3);padding:12px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span style="font-size:12px;color:var(--mist);letter-spacing:0.15em">存档：${saveDate}</span>
      <button class="ctrl-btn" onclick="loadGame()" style="border-color:var(--gold);color:var(--gold);padding:6px 16px;font-size:12px;">▶ 继续游戏</button>
    </div>
  ` : '';

  const headerHTML = `
    <div class="title-block"><div class="main-title">猫城记</div><div class="subtitle">· 文字冒险 ·</div></div>
    ${continueBanner}
    ${breadcrumbHTML}
    ${langToolbar}
    <div class="scene-header"><div class="chapter-tag">${scene.chapter}</div><div class="scene-line"></div></div>
  `;

  if (scene.isEnding) {
    el.innerHTML = `${headerHTML}<div class="ending-banner"><div class="ending-type">ENDING</div><div class="ending-title">${scene.endingEmoji} ${scene.endingType}</div></div>${sceneTextHTML}<div class="controls"><button class="ctrl-btn speak-btn" onclick="toggleSpeak()">🔊 朗读</button><button class="ctrl-btn" id="audio-btn" onclick="toggleAudio()">🔈 音效</button><button class="ctrl-btn" onclick="saveGame()">💾 存档</button><button class="ctrl-btn" onclick="restart()">↺ 重新开始</button><div class="progress-track"><div class="progress-fill" style="width:${getProgress()}%"></div></div><span style="font-size:11px;color:var(--mist);letter-spacing:0.1em">${getProgress()}%</span></div>`;
  } else {
    const ruChoices = CHOICES_RU[currentScene] || [];
  const choicesHTML = (scene.choices || []).map((c, i) => {
    const label = (langMode === 'ru' && ruChoices[i]) ? ruChoices[i] : c.text;
    return `<button class="choice-btn" data-num="${String.fromCharCode(65+i)}." onclick="goTo('${c.next}')">${label}</button>`;
  }).join('');
    el.innerHTML = `${headerHTML}${sceneTextHTML}${scene.choices && scene.choices.length > 0 ? `<div class="choices-label">做出你的选择</div><div class="choices">${choicesHTML}</div>` : ''}<div class="controls"><button class="ctrl-btn speak-btn" onclick="toggleSpeak()">🔊 朗读</button><button class="ctrl-btn" id="audio-btn" onclick="toggleAudio()">🔈 音效</button><button class="ctrl-btn" onclick="saveGame()">💾 存</button>${history.length > 0 ? `<button class="ctrl-btn" onclick="goBack()">← 返回</button>` : ''}<button class="ctrl-btn" onclick="restart()">↺ 重开</button><div class="progress-track"><div class="progress-fill" style="width:${getProgress()}%"></div></div><span style="font-size:11px;color:var(--mist);letter-spacing:0.1em">${getProgress()}%</span></div>`;
  }
}

function toggleSpeak() {
  if (speaking) { stopSpeaking(); return; }
  const scene = SCENES[currentScene];
  let text = plainText(scene.text);
  if (scene.quote) text += '。' + scene.quote;
  if (scene.isEnding) text = scene.endingType + '。' + text;
  speak(text);
}

if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

// ─────────────────────────────────────────────
// AUDIO ENGINE
// ─────────────────────────────────────────────

const Audio = (() => {
  let ctx = null;
  let bgNode = null, bgGain = null;
  let currentBg = null;
  let enabled = true;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // ── White noise buffer ──────────────────────
  function makeNoise(ac, duration) {
    const buf = ac.createBuffer(1, ac.sampleRate * duration, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  // ── Wind ambience ───────────────────────────
  function startWind(ac) {
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.07, ac.currentTime + 2);
    gain.connect(ac.destination);

    function loop() {
      if (!enabled || currentBg !== 'wind') return;
      const src = ac.createBufferSource();
      src.buffer = makeNoise(ac, 4);
      src.loop = false;
      const filter = ac.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 400 + Math.random() * 200;
      filter.Q.value = 0.3;
      const filter2 = ac.createBiquadFilter();
      filter2.type = 'lowpass';
      filter2.frequency.value = 800;
      src.connect(filter);
      filter.connect(filter2);
      filter2.connect(gain);
      src.start();
      src.onended = loop;
    }

    // Slow oscillation
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 0.08;
    lfoGain.gain.value = 0.03;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);
    lfo.start();

    loop();
    return { gain, lfo };
  }

  // ── City crowd ambience ─────────────────────
  function startCity(ac) {
    const masterGain = ac.createGain();
    masterGain.gain.setValueAtTime(0, ac.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.06, ac.currentTime + 1.5);
    masterGain.connect(ac.destination);

    // Low murmur — filtered noise
    function loopNoise() {
      if (!enabled || currentBg !== 'city') return;
      const src = ac.createBufferSource();
      src.buffer = makeNoise(ac, 3);
      const f = ac.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 250 + Math.random() * 150;
      f.Q.value = 0.5;
      src.connect(f);
      f.connect(masterGain);
      src.start();
      src.onended = loopNoise;
    }
    loopNoise();

    // Distant voices — random short sine blips
    function blip() {
      if (!enabled || currentBg !== 'city') return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.frequency.value = 180 + Math.random() * 300;
      o.type = 'sine';
      g.gain.setValueAtTime(0, ac.currentTime);
      g.gain.linearRampToValueAtTime(0.015 + Math.random() * 0.01, ac.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.15 + Math.random() * 0.3);
      o.connect(g);
      g.connect(masterGain);
      o.start();
      o.stop(ac.currentTime + 0.5);
      setTimeout(blip, 200 + Math.random() * 600);
    }
    setTimeout(blip, 500);

    return { gain: masterGain };
  }

  // ── Silence with birds ──────────────────────
  function startSilence(ac) {
    const masterGain = ac.createGain();
    masterGain.gain.setValueAtTime(0, ac.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.04, ac.currentTime + 2);
    masterGain.connect(ac.destination);

    // Very quiet noise floor
    function loopFloor() {
      if (!enabled || currentBg !== 'silence') return;
      const src = ac.createBufferSource();
      src.buffer = makeNoise(ac, 5);
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 200;
      const g = ac.createGain();
      g.gain.value = 0.3;
      src.connect(f);
      f.connect(g);
      g.connect(masterGain);
      src.start();
      src.onended = loopFloor;
    }
    loopFloor();

    // Bird cry — sharp sweep
    function birdCry() {
      if (!enabled || currentBg !== 'silence') return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sawtooth';
      const t = ac.currentTime;
      o.frequency.setValueAtTime(1200 + Math.random() * 400, t);
      o.frequency.exponentialRampToValueAtTime(800, t + 0.2);
      o.frequency.setValueAtTime(1100, t + 0.25);
      o.frequency.exponentialRampToValueAtTime(700, t + 0.45);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.02);
      g.gain.setValueAtTime(0.06, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      const filt = ac.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 1000;
      filt.Q.value = 2;
      o.connect(filt);
      filt.connect(g);
      g.connect(masterGain);
      o.start(t);
      o.stop(t + 0.6);
      setTimeout(birdCry, 3000 + Math.random() * 7000);
    }
    setTimeout(birdCry, 1500);

    return { gain: masterGain };
  }

  // ── Stop background ─────────────────────────
  function stopBg() {
    if (bgGain) {
      const ac = getCtx();
      bgGain.gain.cancelScheduledValues(ac.currentTime);
      bgGain.gain.setValueAtTime(bgGain.gain.value, ac.currentTime);
      bgGain.gain.linearRampToValueAtTime(0, ac.currentTime + 1.2);
    }
    bgNode = null;
    bgGain = null;
  }

  // ── Play background ─────────────────────────
  function playBg(type) {
    if (!enabled) return;
    if (currentBg === type) return;
    currentBg = type;
    stopBg();
    const ac = getCtx();
    let result;
    if (type === 'wind') result = startWind(ac);
    else if (type === 'city') result = startCity(ac);
    else if (type === 'silence') result = startSilence(ac);
    if (result) bgGain = result.gain;
  }

  // ── Gun shot ────────────────────────────────
  function gunshot(count = 1, delay = 0) {
    if (!enabled) return;
    const ac = getCtx();
    for (let i = 0; i < count; i++) {
      const t = ac.currentTime + delay + i * 0.5;
      // Body — noise burst
      const src = ac.createBufferSource();
      src.buffer = makeNoise(ac, 0.3);
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 1200;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.9, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + 0.35);
      // Crack — short sine
      const o = ac.createOscillator();
      const og = ac.createGain();
      o.frequency.value = 120;
      og.gain.setValueAtTime(0, t);
      og.gain.linearRampToValueAtTime(0.4, t + 0.002);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(og); og.connect(ac.destination);
      o.start(t); o.stop(t + 0.1);
    }
  }

  // ── Gong / chapter bell ──────────────────────
  function gong() {
    if (!enabled) return;
    const ac = getCtx();
    const t = ac.currentTime + 0.1;
    [80, 160, 240].forEach((freq, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.15 - i * 0.04, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3 + i);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 4 + i);
    });
  }

  // ── Paper rustle ─────────────────────────────
  function paper() {
    if (!enabled) return;
    const ac = getCtx();
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = makeNoise(ac, 0.2);
    const f = ac.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 3000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  }

  // ── Chime (for quotes) ────────────────────────
  function chime() {
    if (!enabled) return;
    const ac = getCtx();
    const t = ac.currentTime;
    [880, 1320, 1760].forEach((freq, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + i * 0.07);
      g.gain.linearRampToValueAtTime(0.06, t + i * 0.07 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 1.2);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * 0.07);
      o.stop(t + i * 0.07 + 1.5);
    });
  }

  // ── Doom tone (endings) ───────────────────────
  function doomTone() {
    if (!enabled) return;
    const ac = getCtx();
    const t = ac.currentTime;
    [55, 82, 110].forEach((freq, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = i === 0 ? 'sawtooth' : 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.08 - i * 0.02, t + 0.5);
      g.gain.setValueAtTime(0.08 - i * 0.02, t + 1.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 5);
    });
  }

  // ── Toggle ────────────────────────────────────
  function toggle() {
    enabled = !enabled;
    if (!enabled) { currentBg = null; stopBg(); }
    return enabled;
  }

  // ── Scene → audio mapping ─────────────────────
  const BG_MAP = {
    start: 'wind', fight_birds: 'wind', shoot_birds: 'wind',
    despair_start: 'wind', captured_calm: 'silence', captured_struggle: 'silence',
    peaceful_contact: 'wind', threaten_cats: 'wind', follow_young_cat: 'wind',
    refuse_help: 'wind', escape_to_forest: 'wind', night_shadow: 'silence',
    wait_for_dawn: 'silence', talk_xiaoxie: 'city', meet_daxie: 'wind',
    enter_city_with_xiaoxie: 'city', enter_city_alone: 'city',
    find_foreigners: 'city', observe_city: 'city', can_catnation_be_saved: 'city',
    why_stay: 'city', accept_daxie: 'wind', confront_daxie: 'wind',
    go_to_front: 'wind', stay_with_friends: 'silence', find_way_home: 'wind',
    inspire_resistance: 'city', palace_visit: 'city', witness_surrender: 'wind',
    cover_retreat: 'wind', escape_together: 'silence', try_take_friends: 'silence',
    last_stand: 'wind', join_foreigners: 'city', return_to_xiaoxie: 'silence',
    standoff_daxie: 'wind', talk_daying: 'silence', meet_xiaoxie_via_daying: 'silence',
    meet_xiaoxie_via_mi: 'city', follow_old_cat: 'silence', lone_wolf: 'wind',
    foreign_ministry: 'city',
    ending_stay: 'silence', ending_escape_alone: 'wind', ending_survivor: 'silence',
    ending_heroic_death: 'wind', ending_martyr: 'city', ending_survival_guilt: 'silence',
  };

  const GUNSHOT_SCENES = new Set(['shoot_birds','cover_retreat','last_stand','standoff_daxie','return_to_xiaoxie']);
  const DOUBLE_SHOT_SCENES = new Set(['ending_stay']);

  function onSceneEnter(sceneId) {
    if (!enabled) return;
    getCtx(); // ensure context
    const scene = SCENES[sceneId];
    // Chapter transition gong
    if (scene && scene.chapter && scene.chapter.match(/第[一二三四五六七]章/)) gong();
    // Ending doom
    if (scene && scene.isEnding) { setTimeout(doomTone, 800); }
    // Gunshots
    if (DOUBLE_SHOT_SCENES.has(sceneId)) setTimeout(() => gunshot(2, 0), 600);
    else if (GUNSHOT_SCENES.has(sceneId)) setTimeout(() => gunshot(1, 0.3), 400);
    // Background
    const bg = BG_MAP[sceneId] || 'wind';
    playBg(bg);
  }

  return { onSceneEnter, gunshot, gong, paper, chime, doomTone, toggle, playBg,
           get enabled() { return enabled; } };
})();


function toggleAudio() {
  const on = Audio.toggle();
  const btn = document.getElementById('audio-btn');
  if (btn) btn.innerHTML = on ? '🔈 音效' : '🔇 音效';
}

// ─────────────────────────────────────────────
// SAVE / LOAD
// ─────────────────────────────────────────────

const SAVE_KEY = 'maochengji_save';

function saveGame() {
  const data = {
    scene: currentScene,
    history: history,
    visited: Array.from(visited),
    ts: Date.now()
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    showSaveNotice('已保存 ✓');
  } catch(e) {
    showSaveNotice('保存失败');
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { showSaveNotice('没有存档'); return; }
    const data = JSON.parse(raw);
    stopSpeaking();
    currentScene = data.scene || 'start';
    history = data.history || [];
    visited = new Set(data.visited || []);
    langMode = 'zh';
    render();
    Audio.onSceneEnter(currentScene);
    if (SCENES[currentScene] && SCENES[currentScene].quote) setTimeout(() => Audio.chime(), 1200);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showSaveNotice('已读取 ✓');
  } catch(e) {
    showSaveNotice('读取失败');
  }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e) { return false; }
}

function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

function getSaveDate() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data.ts) return null;
    const d = new Date(data.ts);
    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  } catch(e) { return null; }
}

// Auto-save on every scene transition
function autoSave() {
  if (currentScene !== 'start') saveGame();
}

// Toast notification
function showSaveNotice(msg) {
  let el = document.getElementById('save-notice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'save-notice';
    el.style.cssText = `
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(26,18,8,0.92); color: #c4923a;
      font-family: 'Noto Serif SC', serif; font-size: 13px;
      letter-spacing: 0.25em; padding: 10px 24px;
      border: 1px solid rgba(196,146,58,0.4); border-radius: 2px;
      pointer-events: none; z-index: 9999;
      transition: opacity 0.4s;
    `;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}


render();
setTimeout(() => Audio.onSceneEnter('start'), 300);

</script>
